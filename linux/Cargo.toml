[workspace]
resolver = "3"
members = ["crates/joule-core", "crates/joule-hid", "crates/joule-providers", "crates/joule"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
joule-core = { path = "crates/joule-core" }
joule-hid = { path = "crates/joule-hid" }
joule-providers = { path = "crates/joule-providers" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
ksni = { version = "0.3", features = ["blocking"] }
async-channel = "2"
